on:
  schedule:
    - cron: '10 0/6 * * *'
      # During winter season set to '10 0/6 * * *'
      # During late spring and early summer set to '10 0/2 * * *'
      # During wildfire season set to '10 0/1 * * *'
  workflow_dispatch:
  
name: Wildfire data maps scrape reshape build

jobs:
  render:
    name: Scrape fire data
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Set up pandoc for Rmd docs
        uses: r-lib/actions/setup-pandoc@v2
      - name: Set R lib path
        run: |
          mkdir -p $HOME/R/library
          echo "R_LIBS_USER=$HOME/R/library" >> $GITHUB_ENV
      - name: Restore R packages cache
        uses: actions/cache@v4
        with:
          path: ~/R/library
          key: ${{ runner.os }}-r-packages-v1
          restore-keys: ${{ runner.os }}-r-packages-
      - name: Install missing R packages
        run: |
          Rscript -e 'packages <- c("stringr","janitor","readr","dplyr","tidyr","sf","leaflet","htmlwidgets","leaflet.providers","leaflet.extras","htmltools"); install.packages(packages[!packages %in% installed.packages()[,"Package"]], lib="~/R/library")'
      - name: Scrape data, reshape, make fire map
        run: Rscript scripts/fires_scrape_build.R
      - name: Commit results
        run: |
          git add -A
          git commit -m 'New fires data. Maps updated!' || echo "No changes"
          git push origin || echo "No changes to commit"
